# Blueprint de Render para el backend de TO Clínica (Django). La base de datos es PostgreSQL en Neon.
# Los secretos con `sync: false` se piden al crear el servicio; nunca se versionan.
services:
  - type: web
    name: to-clinica-api
    runtime: python
    rootDir: backend
    plan: free # El plan gratuito se duerme; la app móvil tolera el arranque en frío (120 s).
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /salud/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Cadena de conexión de Neon (secreto). Usar el host con `-pooler` para la API.
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: RESPALDO_CLAVE_HEX
        sync: false
