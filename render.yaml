# Blueprint de Render para el backend de TO Clínica (Django + PostgreSQL).
# Los secretos con `sync: false` se piden al crear el servicio; nunca se versionan.
services:
  - type: web
    name: to-clinica-api
    runtime: python
    rootDir: backend
    plan: free # El plan gratuito se duerme; la app móvil tolera el arranque en frío (120 s).
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /salud/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: to-clinica-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: RESPALDO_CLAVE_HEX
        sync: false

databases:
  - name: to-clinica-db
    databaseName: to_clinica
    user: to_clinica
    # La base gratuita de Render caduca a los 30 días: no sirve para datos clínicos reales.
    plan: free
